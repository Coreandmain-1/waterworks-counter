<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Waterworks Counter</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#0b1220;color:#fff}main{max-width:680px;margin:auto;padding:28px 18px}.card{background:#162033;border:1px solid #31415f;border-radius:18px;padding:20px;margin:16px 0}h1{font-size:28px;margin:8px 0}textarea{box-sizing:border-box;width:100%;min-height:120px;border-radius:14px;padding:14px;font-size:18px}button{width:100%;padding:16px;margin-top:12px;border:0;border-radius:14px;font-size:18px;font-weight:700}.primary{background:#fff;color:#0b1220}.secondary{background:#263653;color:#fff}.result{white-space:pre-wrap;font-size:18px;line-height:1.45}.small{opacity:.75;font-size:14px}</style></head><body><main><h1>Waterworks Counter</h1><div class="small">Ford brass quick counter assistant</div><div class="card"><textarea id="q" placeholder="Example: 1 inch corp stop, CC inlet, pack joint CTS outlet"></textarea><button class="primary" onclick="lookup()">Find Part</button><button class="secondary" onclick="voice()">🎙 Speak Request</button></div><div class="card"><strong>Result</strong><div id="out" class="result">Enter or speak a request.</div></div><div class="small">Current build: Ford corp stops, curb stops and couplers. Confirm catalog number before ordering until the catalog dataset is fully loaded.</div><script>
const products=[{type:"corp stop",keys:["corp","corporation"],series:"F1000",note:"Ford corporation stop family. Exact suffix depends on inlet/outlet and size."},{type:"coupler",keys:["coupler","coupling"],series:"FC",note:"Ford coupling family. CTS/IP and connection style determine exact catalog number."},{type:"curb stop",keys:["curb","curb stop","ball valve"],series:"B / FB",note:"Ford ball valve/curb stop family. Exact suffix depends on ends and size."}];
const codes={"fip":"1","female ip":"1","flare":"2","pack joint cts":"4","copper":"4","cts":"4","pack joint pe":"6","poly":"6","pe":"6","mip":"8","male ip":"8","grip":"G","quick joint":"Q","ultra":"U"};
const sizes={".5":"2","1/2":"2","½":"2",".75":"3","3/4":"3","¾":"3","1":"4","1.25":"5","1 1/4":"5","1¼":"5","1.5":"6","1 1/2":"6","1½":"6","2":"7"};
function lookup(){let q=document.getElementById("q").value.toLowerCase().replace(/inch|inches|"/g," ").replace(/\s+/g," ").trim();let p=products.find(x=>x.keys.some(k=>q.includes(k)));if(!p){document.getElementById("out").textContent="I need the product type: corp stop, curb stop, or coupler.";return}let found=[];for(const [k,v] of Object.entries(codes))if(q.includes(k))found.push(k+" = #"+v);let sz=Object.keys(sizes).sort((a,b)=>b.length-a.length).find(s=>new RegExp("(^|\\s)"+s.replace(".","\\.")+"($|\\s)").test(q));let s=sz?sz+" in = size code "+sizes[sz]:"size not confidently identified";document.getElementById("out").textContent=p.type.toUpperCase()+"\nFamily: "+p.series+"\n"+s+"\n"+(found.length?found.join("\n"):"connection code not confidently identified")+"\n\n"+p.note}
function voice(){if(!("webkitSpeechRecognition" in window)){alert("Use your iPhone Shortcut dictation, or type the request here.");return}let r=new webkitSpeechRecognition();r.lang="en-US";r.onresult=e=>{document.getElementById("q").value=e.results[0][0].transcript;lookup()};r.start()}
const u=new URLSearchParams(location.search);if(u.get("q")){document.getElementById("q").value=u.get("q");lookup()}
</script></main></body></html>
