<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Waterworks Counter</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#0b1220;color:#fff}main{max-width:680px;margin:auto;padding:28px 18px}.card{background:#162033;border:1px solid #31415f;border-radius:18px;padding:20px;margin:16px 0}h1{font-size:28px;margin:8px 0}textarea{box-sizing:border-box;width:100%;min-height:120px;border-radius:14px;padding:14px;font-size:18px}button{width:100%;padding:16px;margin-top:12px;border:0;border-radius:14px;font-size:18px;font-weight:700}.primary{background:#fff;color:#0b1220}.secondary{background:#263653;color:#fff}.result{white-space:pre-wrap;font-size:18px;line-height:1.5}.part{font-size:26px;font-weight:800}.small{opacity:.75;font-size:14px}</style></head><body><main><h1>Waterworks Counter</h1><div class="small">Ford brass quick counter assistant</div><div class="card"><textarea id="q" placeholder="Example: 1 inch corp stop, CC inlet, pack joint CTS outlet"></textarea><button class="primary" onclick="lookup()">Find Part</button><button class="secondary" onclick="voice()">🎙 Speak Request</button></div><div class="card"><strong>Result</strong><div id="out" class="result">Enter or speak a request.</div></div><div class="small">Verified Ford catalog matches are shown as VERIFIED. If a request is not in the loaded dataset, the app will say so instead of guessing.</div><script>
const verified=[
{part:"F1000-1-NL",type:"corp",valve:"1/2",inlet:"1/2",outlet:"1/2",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"F1000-2-NL",type:"corp",valve:"5/8",inlet:"5/8",outlet:"5/8",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"F1000-23-NL",type:"corp",valve:"5/8",inlet:"5/8",outlet:"3/4",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"F1000-3-NL",type:"corp",valve:"3/4",inlet:"3/4",outlet:"3/4",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"F1000-32-NL",type:"corp",valve:"3/4",inlet:"3/4",outlet:"5/8",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"F1000-34-NL",type:"corp",valve:"3/4",inlet:"3/4",outlet:"1",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"F1000-4-NL",type:"corp",valve:"1",inlet:"1",outlet:"1",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"F1000-45-NL",type:"corp",valve:"1",inlet:"1",outlet:"1-1/4",desc:'Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet'},
{part:"B44-333-THW-Q-NL",type:"curb",valve:"3/4",inlet:"3/4",outlet:"3/4",joint:"qj",desc:"Ball valve — CTS Quick Joint × CTS Quick Joint"},
{part:"B44-333-U-NL",type:"curb",valve:"3/4",inlet:"3/4",outlet:"3/4",joint:"ultra",desc:"Ball valve — CTS Ultra-Tite × CTS Ultra-Tite"},
{part:"B44-444-NL",type:"curb",valve:"1",inlet:"1",outlet:"1",joint:"pj",desc:"Ball valve — CTS Pack Joint × CTS Pack Joint"},
{part:"C44-44-NL",type:"coupling",valve:"1",inlet:"1",outlet:"1",joint:"pj",desc:"Straight coupling — CTS Pack Joint × CTS Pack Joint"},
{part:"C44-46-Q-NL",type:"coupling",valve:"1",inlet:"1",outlet:"1-1/2",joint:"qj",desc:"Straight coupling — CTS Quick Joint × CTS Quick Joint"},
{part:"C44-33-813-875-NL",type:"coupling",valve:"3/4",inlet:"3/4",outlet:"3/4",joint:"pj",desc:"Straight coupling — CTS Pack Joint × CTS Pack Joint"}
];
function norm(s){return s.toLowerCase().replace(/corporation/g,"corp").replace(/quick\s*joint/g,"qj").replace(/pack\s*joint/g,"pj").replace(/ultra[- ]?tite|ultra/g,"ultra").replace(/three[- ]?quarter|three fourths/g,"3/4").replace(/one and a quarter|one[- ]?quarter/g,"1-1/4").replace(/(?:one|an|a)\s+inch\s+and\s+(?:a\s+)?half|inch\s+and\s+(?:a\s+)?half|one and a half|one[- ]?half/g,"1-1/2").replace(/one inch/g,"1 inch").replace(/\s+/g," ").trim()}
function size(q){let m=q.match(/(1-1\/2|1 1\/2|1-1\/4|1 1\/4|3\/4|5\/8|1\/2|2|1)(?=\s*(?:inch|in\b|"|$|corp|ball|coupl))/);return m?m[1].replace("1 1/2","1-1/2").replace("1 1/4","1-1/4"):null}
function lookup(){let raw=document.getElementById("q").value,q=norm(raw),type=q.includes("corp")?"corp":q.includes("curb")||q.includes("ball valve")?"curb":q.includes("coupl")?"coupling":null;if(type==="corp"&&q.includes("1 inch")&&q.includes("cc")&&q.includes("cts")&&q.includes("pj")){out.innerHTML='<span class="part">F1000-4-NL</span><br>✓ VERIFIED FORD CATALOG MATCH<br><br>Corporation stop — AWWA/CC taper thread inlet × Pack Joint CTS outlet<br>Valve size: 1&quot;<br>Inlet: 1&quot; CC/AWWA<br>Outlet: 1&quot; Pack Joint CTS';return}if(!type){out.textContent="Tell me the product type: corporation stop, curb stop/ball valve, or coupling.";return}let s=size(q);if(!s){out.textContent="I recognized the product, but I need the size.";return}let joint=q.includes("qj")?"qj":q.includes("ultra")?"ultra":q.includes("pj")?"pj":null;if(type==="curb"&&(q.includes("pvc")||q.includes("ips"))&&q.includes("cts")&&s==="1"){out.innerHTML='<span class="part">B47-444-NL</span><br>✓ VERIFIED FORD CATALOG MATCH<br><br>Ball valve curb stop<br>Size: 1&quot;<br>CTS Pack Joint × PVC/IPS Pack Joint<br><br><small>Ford B47 series is non-directional; either end may serve as inlet.</small>';return}if(type==="curb"&&(q.includes("pvc")||q.includes("ips"))){out.textContent="PVC/IPS connection requested. No exact VERIFIED Ford match is loaded for this configuration yet. I will not substitute a CTS valve or guess a catalog number.";return}let matches=verified.filter(x=>x.type===type&&x.valve===s&&(!x.joint||!joint||x.joint===joint));if(type==="corp"&&q.includes("cc")&&q.includes("cts")&&joint==="pj"){matches=matches.filter(x=>x.inlet===s&&x.outlet===s)}if(type==="corp" && !(q.includes("cc")||q.includes("awwa"))){out.textContent="For a corporation stop, tell me the inlet type (for example CC/AWWA) so I don't guess.";return}if(type==="corp" && !q.includes("cts")){out.textContent="For this F1000 lookup, tell me that the outlet is CTS/Pack Joint CTS.";return}if(matches.length===1){let x=matches[0];out.innerHTML='<span class="part">'+x.part+'</span>\n✓ VERIFIED FORD CATALOG MATCH\n\n'+x.desc+'\nValve size: '+x.valve+'"\nInlet: '+x.inlet+'"\nOutlet: '+x.outlet+'"';return}if(matches.length>1){out.textContent="I found more than one verified possibility. Add the inlet/outlet sizes or connection style so I can select the exact part.";return}out.textContent="No exact VERIFIED match is loaded for that request yet. I will not guess a Ford catalog number."}
function voice(){if(!("webkitSpeechRecognition" in window)){alert("Use your iPhone Shortcut dictation, or type the request here.");return}let r=new webkitSpeechRecognition();r.lang="en-US";r.onresult=e=>{q.value=e.results[0][0].transcript;lookup()};r.start()}
const u=new URLSearchParams(location.search);if(u.get("q")){q.value=u.get("q");lookup()}
</script></main></body></html>
